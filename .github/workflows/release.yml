name: Release

# Pushing a tag such as v0.1.0 publishes a release with an installer for each system. The file
# names carry no version, so the README's links to releases/latest/download always work.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        run: gh release create "${{ github.ref_name }}" --title "TryMyDev ${{ github.ref_name }}" --generate-notes --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unsigned: no code-signing certificate. Windows SmartScreen asks once.
          - os: windows-latest
            package: npx electron-builder --win --publish never
            assets: dist/TryMyDev-Setup.exe
          # macos-latest is an Apple Silicon runner: arm64 only. Ad-hoc signed in after-pack.
          - os: macos-latest
            package: npx electron-builder --mac --arm64 --publish never
            assets: dist/TryMyDev-arm64.dmg
          - os: ubuntu-latest
            package: npx electron-builder --linux --publish never
            assets: dist/TryMyDev.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The unit tests run in the Tests workflow on every push, this tag's included.
      - run: npm run typecheck
      - name: Build and package
        shell: bash
        run: npm run build && ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Attach the installer to the release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.assets }} --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
